name: Issue 704 bootstrap

on:
  push:
    branches:
      - issue-704-concurrency-depth

permissions:
  contents: write

jobs:
  apply-and-check:
    name: Apply #704 patch and focused checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: issue-704-concurrency-depth
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.0.0 --activate

      - name: Apply issue 704 patch
        run: python3 scripts/tmp/issue-704-bootstrap.py

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Focused unit tests
        run: pnpm test -- tests/unit/concurrency-coverage.test.ts tests/unit/concurrency-reasoning-items.test.ts

      - name: Typecheck
        run: pnpm typecheck

      - name: Commit clean implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Deepen concurrency reasoning curriculum (#704)"
          git push origin HEAD:issue-704-concurrency-depth
