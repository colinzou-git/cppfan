name: issue-693-implement
on:
  push:
    branches:
      - fix/693-google-dsa-expansion
permissions:
  contents: write
jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Adapt generator skill fallback to current curriculum
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/issue-693-implement.mjs')
          s = p.read_text()
          old = '''function choose(candidates) {
            const found = candidates.find((id) => skillIds.has(id));
            if (!found) throw new Error(`No skill candidate exists: ${candidates.join(", ")}`);
            return found;
          }'''
          new = '''function choose(candidates) {
            let found = candidates.find((id) => skillIds.has(id));
            if (!found) {
              const parts = candidates[0].split(".");
              const prefix = parts.slice(0, 2).join(".") + ".";
              found = [...skillIds].find((id) => id.startsWith(prefix));
            }
            if (!found) throw new Error(`No skill candidate or module fallback exists: ${candidates.join(", ")}`);
            return found;
          }'''
          if old not in s:
              raise SystemExit('choose() anchor not found')
          p.write_text(s.replace(old, new))
          PY
      - name: Generate issue 693 changes
        run: node scripts/issue-693-implement.mjs
      - name: Focused unit tests
        run: pnpm exec vitest run tests/unit/interview-problems.test.ts tests/unit/judge-test-suites.test.ts tests/unit/follow-ups.test.ts
      - name: Verify executable interview catalog
        run: pnpm verify:interview-catalog
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Full unit suite
        run: pnpm test
      - name: Production build
        run: pnpm build
      - name: Representative browser regression
        run: pnpm exec playwright test tests/e2e/interview-dsa-expansion.spec.ts --project=chromium
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "feat(interview): expand Google SWE DSA coverage (#693)"
          git push origin HEAD:fix/693-google-dsa-expansion
