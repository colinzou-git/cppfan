name: issue-693-implement
on:
  push:
    branches:
      - fix/693-google-dsa-expansion
permissions:
  contents: write
jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Adapt generator to current curriculum
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/issue-693-implement.mjs')
          s = p.read_text()
          old = '''function choose(candidates) {
            const found = candidates.find((id) => skillIds.has(id));
            if (!found) throw new Error(`No skill candidate exists: ${candidates.join(", ")}`);
            return found;
          }'''
          new = '''function choose(candidates) {
            let found = candidates.find((id) => skillIds.has(id));
            if (!found) {
              const parts = candidates[0].split(".");
              const prefix = parts.slice(0, 2).join(".") + ".";
              found = [...skillIds].find((id) => id.startsWith(prefix));
            }
            if (!found) throw new Error(`No skill candidate or module fallback exists: ${candidates.join(", ")}`);
            return found;
          }'''
          if old not in s:
              raise SystemExit('choose() anchor not found')
          s = s.replace(old, new)
          s = s.replace('primary: ["dsa.trees.bst"]', 'primary: ["dsa.trees.bst_search"]')
          s = s.replace('primary: ["dsa.graphs.shortest_paths"]', 'primary: ["dsa.graphs.shortest_path"]')
          s = s.replace('primary: ["dsa.recursion.backtracking"]', 'primary: ["dsa.complexity.recursion_choice"]')
          s = s.replace('"4 5 0 0\\n..#..\\n.##..\\n.....\\n#....\\n", "12\\n"', '"4 5 0 0\\n..#..\\n.##..\\n.....\\n#....\\n", "16\\n"')
          p.write_text(s)
          PY
      - name: Generate issue 693 changes
        run: node scripts/issue-693-implement.mjs
      - name: Add scale fixtures for new timed mock bases
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          additions = {
            'services/interview-judge/catalog-fixtures-08a.json': {
              'iv.tree.max-path-sum': {
                'id': 'hidden.scale', 'name': 'small crossing path', 'hidden': True, 'category': 'scale',
                'stdin': '3\n2 -1 3\n', 'expectedStdout': '5\n'
              }
            },
            'services/interview-judge/catalog-fixtures-08b.json': {
              'iv.dp.edit-distance': {
                'id': 'hidden.scale', 'name': 'equal strings', 'hidden': True, 'category': 'scale',
                'stdin': 'same\nsame\n', 'expectedStdout': '0\n'
              }
            },
            'services/interview-judge/catalog-fixtures-08c.json': {
              'iv.design.time-key-value': {
                'id': 'hidden.scale', 'name': 'wide timestamp gap', 'hidden': True, 'category': 'scale',
                'stdin': '4\nset k v1 1\nset k v2 100\nget k 99\nget k 100\n', 'expectedStdout': 'v1\nv2\n'
              },
              'iv.graph.k-stop-cheapest-route': {
                'id': 'hidden.scale', 'name': 'full stop budget', 'hidden': True, 'category': 'scale',
                'stdin': '5 5 0 4 3\n0 1 1\n1 2 1\n2 3 1\n3 4 1\n0 4 10\n', 'expectedStdout': '4\n'
              }
            }
          }
          for path, by_id in additions.items():
              p = Path(path)
              data = json.loads(p.read_text())
              for definition in data['definitions']:
                  case = by_id.get(definition['problemId'])
                  if case:
                      definition['cases'].append(case)
              p.write_text(json.dumps(data, indent=2) + '\n')
          Path('services/interview-judge/.catalog-note').write_text('120 problems / 387 executable fixture cases\n')
          PY
      - name: Focused unit tests
        run: pnpm exec vitest run tests/unit/interview-problems.test.ts tests/unit/judge-test-suites.test.ts tests/unit/follow-ups.test.ts
      - name: Verify executable interview catalog
        run: pnpm verify:interview-catalog
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Full unit suite
        run: pnpm test
      - name: Production build
        run: pnpm build
      - name: Representative browser regression
        run: pnpm exec playwright test tests/e2e/interview-dsa-expansion.spec.ts --project=chromium
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "feat(interview): expand Google SWE DSA coverage (#693)"
          git push origin HEAD:fix/693-google-dsa-expansion
